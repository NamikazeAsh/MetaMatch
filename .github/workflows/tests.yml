name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        cache: pip

    - name: Set up Node
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: src/metamatch/engine/package-lock.json

    - name: Install Damage Calc
      working-directory: src/metamatch/engine
      run: npm ci

    - name: Install Python Dependencies
      run: |
        # CPU torch keeps the install small; the tests never run a model on a GPU
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt pytest ruff

    - name: Lint
      run: ruff check src bench scripts --select E9,F63,F7,F82

    - name: Unit Tests
      run: pytest -q

    # Planner and engine only, no LLM: fails the build if fact answering regresses on the dev set
    - name: MetaBench Regression Gate
      run: python bench/run.py --arm template --name ci_template --min-accuracy 1.0
