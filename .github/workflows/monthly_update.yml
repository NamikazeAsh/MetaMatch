name: Monthly Meta Update

on:
  schedule:
    # Smogon posts a month's stats a few days into the next one, so try several days.
    # The script exits early once data/stats/manifest.json already has the month.
    - cron: '0 6 2,5,9,15 * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI for testing

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the new files

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install requests beautifulsoup4

    - name: Run Update Script
      run: python scripts/update_meta.py

    - name: Commit and Push if Changed
      run: |
        git config user.name "MetaMatch Bot"
        git config user.email "bot@metamatch.ai"
        # data/stats/ is gitignored, so force add; topPoke and speed tiers are already tracked
        git add -f data/stats/
        git add data/json/topPoke.json data/json/meta_speeds.json data/json/meta_speeds_champions.json
        git commit -m "Update Smogon stats [skip ci]" || exit 0
        git push
