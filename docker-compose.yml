services:
  # Service 1: Your Streamlit App
  metamatch:
    build: .
    container_name: metamatch-app
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    volumes:
      - ./data:/app/data  # Persist local data (json/stats)
    networks:
      - metamatch-net

  # Service 2: The Local AI Provider
  ollama:
    image: ollama/ollama:latest
    container_name: metamatch-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama # Persist downloaded models
    networks:
      - metamatch-net

# Define a shared network
networks:
  metamatch-net:
    driver: bridge

# Define persistence for the LLM models
volumes:
  ollama_storage:
